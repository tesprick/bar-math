/* ----------------------------- matching logic ---------------------------- */
function normalize(s) {
  return (s || "")
    .toLowerCase()
    .replace(/\([^)]*\)/g, " ")
    .replace(/\bfreshly squeezed\b/g, " ")
    .replace(/\bfresh\b/g, " ")
    .replace(/\bjuice of\b/g, " ")
    .replace(/[.,;:]+$/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
const ckey = (ing) => normalize(ing.canonical || ing.name);
function fixIngredient(i) {
  let name = (i.name || "").trim();
  let amount = (i.amount || "").trim();
  let canonical = (i.canonical || "").trim();
  // move a leading unit word ("dash/dashes/drop/drops") out of the name into the amount
  const m = name.match(/^(dash(?:es)?|drop(?:s)?)\s+/i);
  if (m && /^[\d.\-/]+$/.test(amount.replace(/\s+/g, ""))) {
    amount = (amount + " " + m[1].toLowerCase()).trim();
    name = name.slice(m[0].length).trim();
  }
  if (canonical.toLowerCase() === "benedictine") canonical = "bénédictine";
  return { ...i, name, amount, canonical };
}
function migrate(data) {
  if (!data) return data;
  const recipes = (data.recipes || []).map((r) => ({
    ...r,
    ingredients: (r.ingredients || []).map(fixIngredient),
  }));
  const pantry = (data.pantry || []).map((p) =>
    p && p.toLowerCase() === "benedictine" ? "bénédictine" : p
  );
  return { ...data, recipes, pantry };
}

const required = (r) => (r.ingredients || []).filter((i) => !i.optional && !i.garnish);
function pantryToSet(pantry) {
  return new Set((pantry || []).map((p) => normalize(p)));
}
function missingFor(r, set) {
  const seen = new Map();
  required(r).forEach((i) => {
    const k = ckey(i);
    if (!set.has(k) && !seen.has(k)) seen.set(k, i.canonical || i.name);
  });
  return [...seen.entries()].map(([key, label]) => ({ key, label }));
}
const isMakeable = (r, set) => required(r).length > 0 && missingFor(r, set).length === 0;

function rankAdditions(recipes, set) {
  const map = new Map();
  recipes.forEach((r) => {
    if (isMakeable(r, set)) return;
    const miss = missingFor(r, set);
    miss.forEach((m) => {
      if (!map.has(m.key)) map.set(m.key, { key: m.key, label: m.label, unlocks: [], helps: [] });
      map.get(m.key).helps.push(r);
      if (miss.length === 1) map.get(m.key).unlocks.push(r);
    });
  });
  return [...map.values()].sort(
    (a, b) =>
      b.unlocks.length - a.unlocks.length ||
      b.helps.length - a.helps.length ||
      a.label.localeCompare(b.label)
  );
}

function greedyList(recipes, baseSet, n) {
  const set = new Set(baseSet);
  const picks = [];
  for (let i = 0; i < n; i++) {
    const ranked = rankAdditions(recipes, set);
    const best = ranked.find((r) => r.unlocks.length > 0);
    if (!best) break;
    set.add(best.key);
    picks.push({ label: best.label, key: best.key, newCocktails: best.unlocks.map((c) => c.name) });
  }
  const total = recipes.filter((r) => isMakeable(r, set)).length;
  return { picks, totalAfter: total };
}

/* ------------------------------- AI parsing ------------------------------ */
const uid = () =>
  (typeof crypto !== "undefined" && crypto.randomUUID)
    ? crypto.randomUUID()
    : "id" + Math.random().toString(36).slice(2);

function extractJSON(text) {
  if (!text) return null;
  let t = text.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
  const tries = [t];
  const a = t.indexOf("["), b = t.lastIndexOf("]");
  if (a !== -1 && b > a) tries.push(t.slice(a, b + 1));
  const c = t.indexOf("{"), d = t.lastIndexOf("}");
  if (c !== -1 && d > c) tries.push(t.slice(c, d + 1));
  for (const s of tries) {
    try {
      const v = JSON.parse(s);
      return Array.isArray(v) ? v : [v];
    } catch (e) { /* keep trying */ }
  }
  return null;
}

const SYS = `You convert cocktail recipes into clean JSON for a home-bar matching app.
Return ONLY a JSON array (no prose, no markdown fences) of cocktail objects with this schema:
{
  "name": string,
  "type": string,             // one of: Sour, Old Fashioned, Manhattan, Martini, Negroni, Tiki, Long — or "" if unsure
  "instructions": string,           // concise, your own words
  "notes": string,                  // tasting notes, attribution, riffs — "" if none
  "ingredients": [
    { "name": string,               // as written, e.g. "2 oz fresh lime juice" parts ok
      "canonical": string,          // normalized for matching: lowercase, NO amounts, keep meaningful type
      "amount": string,             // e.g. "2 oz", "0.75 oz", "2 dashes", "" if none
      "optional": boolean,
      "garnish": boolean }
  ]
}
Canonical rules: drop quantities & the word "fresh"; KEEP meaningful modifiers that change matching
("dry vermouth" vs "sweet vermouth", "white rum" vs "dark rum", "rye whiskey", "angostura bitters").
Use shared canonicals where bartenders would substitute: Cointreau/triple sec -> "orange liqueur".
Mark rims, peels, cherries, wheels, sprigs as garnish:true. Mark "optional"/"to taste" items optional:true.
If several cocktails appear, return them all. Output JSON only.`;

function getApiConfig() {
  try {
    const c = JSON.parse(localStorage.getItem("cocktaillab_apiconfig") || "{}");
    return { apiKey: c.apiKey || "", model: c.model || "claude-sonnet-4-6" };
  } catch(e) { return { apiKey: "", model: "claude-sonnet-4-6" }; }
}

async function callClaude({ messages, tools, max_tokens = 2000 }) {
  const cfg = getApiConfig();
  if (!cfg.apiKey) throw new Error("No API key set — open ⚙ Settings to add your Anthropic API key.");
  const body = { model: cfg.model, max_tokens, system: SYS, messages };
  if (tools) body.tools = tools;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": cfg.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error((err.error && err.error.message) || ("API error " + res.status));
  }
  const data = await res.json();
  return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
}

async function parseRecipe(mode, payload) {
  let messages, tools;
  if (mode === "text") {
    messages = [{ role: "user", content: `Extract the cocktail recipe(s):\n\n${payload}` }];
  } else if (mode === "link") {
    tools = [{ type: "web_search_20250305", name: "web_search" }];
    messages = [{
      role: "user",
      content: `Use web search to retrieve the cocktail recipe(s) at this page, then extract them: ${payload}`,
    }];
  } else if (mode === "image") {
    messages = [{
      role: "user",
      content: [
        { type: "image", source: { type: "base64", media_type: payload.media_type, data: payload.data } },
        { type: "text", text: "Extract every cocktail recipe visible in this image." },
      ],
    }];
  }
  const text = await callClaude({ messages, tools });
  const arr = extractJSON(text);
  if (!arr) throw new Error("Could not read a recipe from that. Try pasting the text directly.");
  return arr.map(normalizeParsed);
}

function normalizeParsed(c) {
  return {
    id: uid(),
    name: (c.name || "Untitled").trim(),
    type: c.type || "",
    instructions: c.instructions || "",
    notes: c.notes || "",
    source: c.source || "",
    ingredients: (c.ingredients || []).map((i) => fixIngredient({
      name: (i.name || "").trim(),
      canonical: (i.canonical || normalize(i.name) || "").trim(),
      amount: i.amount || "",
      optional: !!i.optional,
      garnish: !!i.garnish,
    })),
  };
}

/* ================================ UI ===================================== */
const TABS = [
  { id: "make", label: "Tonight", icon: Martini },
  { id: "bar", label: "My Bar", icon: Wine },
  { id: "recipes", label: "Recipe Book", icon: BookOpen },
  { id: "shop", label: "Shopping", icon: ShoppingBag },
];

function App() {
  const [loaded, setLoaded] = useState(false);
  const [pantry, setPantry] = useState([]);
  const [recipes, setRecipes] = useState([]);
  const [tab, setTab] = useState("make");
  const [showSettings, setShowSettings] = useState(false);
  const first = useRef(true);

  useEffect(() => {
    (async () => {
      const data = await loadData();
      if (data) {
        let recipes = data.recipes || SEED;
        if ((data.dataVersion || 0) < DATA_VERSION) {
          const have = new Set(recipes.map((r) => r.name));
          const additions = SEED.filter((r) => NEW_RECIPE_NAMES_V2.has(r.name) && !have.has(r.name));
          if (additions.length) {
            recipes = [...recipes, ...additions];
            persist({ pantry: data.pantry || [], recipes, dataVersion: DATA_VERSION });
          }
        }
        const sMap = Object.fromEntries(SEED.map(r=>[r.name,r.type]).filter(([,t])=>t));
        recipes = recipes.map(r=>r.type?r:{...r,type:sMap[r.name]||""});
        setPantry(data.pantry || []);
        setRecipes(recipes);
      } else {
        setRecipes(SEED);
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (first.current) { first.current = false; return; }
    persist({ pantry, recipes, dataVersion: DATA_VERSION });
  }, [pantry, recipes, loaded]);

  const set = useMemo(() => pantryToSet(pantry), [pantry]);
  const makeable = useMemo(() => recipes.filter((r) => isMakeable(r, set)), [recipes, set]);

  const addToBar = (label) => {
    const k = normalize(label);
    if (!pantry.some((p) => normalize(p) === k)) setPantry((p) => [...p, label].sort((a, b) => a.localeCompare(b)));
  };
  const removeFromBar = (label) => setPantry((p) => p.filter((x) => x !== label));

  return (
    <div className="cl-root">
      <style>{CSS}</style>
      <div className="cl-grain" />
      <header className="cl-head">
        <div className="cl-head-rule" />
        <div className="cl-head-mid">
          <FlaskConical size={20} strokeWidth={1.4} />
          <div>
            <h1>The Cocktail Laboratory</h1>
            <p>{makeable.length} of {recipes.length} pourable tonight · {pantry.length} bottles on the shelf</p>
          </div>
          <FlaskConical size={20} strokeWidth={1.4} style={{ transform: "scaleX(-1)" }} />
        </div>
        <div className="cl-head-rule" />
      </header>
      <button className="cl-settings-btn" onClick={() => setShowSettings(true)} title="API Settings">
        <Settings size={16} strokeWidth={1.4}/>
      </button>

      <nav className="cl-tabs">
        {TABS.map((t) => {
          const I = t.icon;
          return (
            <button key={t.id} className={"cl-tab" + (tab === t.id ? " on" : "")} onClick={() => setTab(t.id)}>
              <I size={15} strokeWidth={1.6} /> <span>{t.label}</span>
            </button>
          );
        })}
      </nav>

      <main className="cl-main">
        {!loaded ? (
          <div className="cl-empty"><Loader2 className="spin" size={22} /> Polishing the glassware…</div>
        ) : tab === "make" ? (
          <MakeTab recipes={recipes} set={set} addToBar={addToBar} />
        ) : tab === "bar" ? (
          <BarTab recipes={recipes} pantry={pantry} set={set} addToBar={addToBar} removeFromBar={removeFromBar} />
        ) : tab === "recipes" ? (
          <RecipesTab recipes={recipes} setRecipes={setRecipes} />
        ) : (
          <ShopTab recipes={recipes} set={set} addToBar={addToBar} />
        )}
      </main>
      {showSettings && <SettingsPanel onClose={() => setShowSettings(false)} />}
    </div>
  );
}

function SettingsPanel({ onClose }) {
  const [cfg, setCfg] = useState(() => {
    try { return JSON.parse(localStorage.getItem("cocktaillab_apiconfig") || "{}"); }
    catch(e) { return {}; }
  });
  const save = () => {
    localStorage.setItem("cocktaillab_apiconfig", JSON.stringify(cfg));
    onClose();
  };
  return (
    <div className="cl-modal-overlay" onClick={onClose}>
      <div className="cl-modal" onClick={e => e.stopPropagation()}>
        <div className="cl-rowbtns">
          <h3 style={{fontFamily:"'Fraunces',serif",fontWeight:600,fontSize:22,margin:0,color:"var(--ink)"}}>API Settings</h3>
          <button className="cl-btn ghost" onClick={onClose}><X size={14}/> Close</button>
        </div>
        <p className="cl-note">Enter your Anthropic API key to enable recipe import from text, links, and photos. Your key is stored only in your browser's local storage and never sent anywhere except Anthropic's API.</p>
        <Field label="Anthropic API Key">
          <input className="cl-input" type="password" placeholder="sk-ant-api03-…"
            value={cfg.apiKey || ""} onChange={e => setCfg({...cfg, apiKey: e.target.value})} />
        </Field>
        <Field label="Model (leave blank for default: claude-sonnet-4-6)">
          <input className="cl-input" placeholder="claude-sonnet-4-6"
            value={cfg.model || ""} onChange={e => setCfg({...cfg, model: e.target.value})} />
        </Field>
        <p className="cl-note" style={{color:"var(--ox)"}}>⚠ Only use this on a trusted personal device. Anyone with access to your browser's localStorage can read the key.</p>
        <div className="cl-rowbtns end">
          <button className="cl-btn gold" onClick={save}><Check size={14}/> Save</button>
        </div>
      </div>
    </div>
  );
}
/* ------------------------------ Tonight tab ------------------------------ */
function MakeTab({ recipes, set, addToBar }) {
  const makeable = recipes.filter((r) => isMakeable(r, set));
  const oneAway = recipes
    .map((r) => ({ r, miss: missingFor(r, set) }))
    .filter((x) => x.miss.length === 1)
    .sort((a, b) => a.r.name.localeCompare(b.r.name));

  if (recipes.length === 0)
    return <div className="cl-empty">Your recipe book is empty. Add some recipes to get started.</div>;

  return (
    <div className="cl-col">
      <SectionTitle>Ready to pour <em>{makeable.length}</em></SectionTitle>
      {makeable.length === 0 ? (
        <p className="cl-note">Nothing fully stocked yet — check “one sip away” below, or add bottles in My Bar.</p>
      ) : (
        <div className="cl-grid">{makeable.map((r) => <RecipeCard key={r.id} r={r} set={set} />)}</div>
      )}

      {oneAway.length > 0 && (
        <>
          <SectionTitle>One sip away <em>{oneAway.length}</em></SectionTitle>
          <p className="cl-note">Each of these needs exactly one more thing.</p>
          <div className="cl-grid">
            {oneAway.map(({ r, miss }) => (
              <RecipeCard key={r.id} r={r} set={set} missing={miss} onGet={() => addToBar(miss[0].label)} />
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function RecipeCard({ r, set, missing, onGet }) {
  const [open, setOpen] = useState(false);
  const dim = missing && missing.length > 0;
  return (
    <article className={"cl-card" + (dim ? " dim" : "")}>
      <div className="cl-card-top" onClick={() => setOpen((o) => !o)}>
        <h3>{r.name}</h3>
        {r.type && <span className="cl-type">{r.type}</span>}
      </div>
      <ul className="cl-ings">
        {r.ingredients.map((i, idx) => {
          const have = set.has(ckey(i)) || i.garnish;
          return (
            <li key={idx} className={have ? "have" : "need"}>
              <span className="amt">{i.amount}</span>
              <span className="nm">{i.name}{i.optional ? " (optional)" : ""}{i.garnish ? " · garnish" : ""}</span>
            </li>
          );
        })}
      </ul>
      {dim && (
        <div className="cl-missing">
          <span>Missing: <strong>{missing.map((m) => m.label).join(", ")}</strong></span>
          {onGet && <button className="cl-mini" onClick={onGet}><Plus size={12} /> Add to bar</button>}
        </div>
      )}
      {(r.instructions || r.notes) && (
        <button className="cl-method" onClick={() => setOpen((o) => !o)}>
          {open ? <ChevronDown size={13} /> : <ChevronRight size={13} />} {r.instructions ? "Method" : "Notes"}
        </button>
      )}
      {open && (r.instructions || r.notes) && (
        <div className="cl-instrwrap">
          {r.instructions && <p className="cl-instr">{r.instructions}{r.source ? <> · <a href={r.source} target="_blank" rel="noreferrer">source</a></> : null}</p>}
          {r.notes && <p className="cl-notesline"><span>Notes</span> {r.notes}</p>}
        </div>
      )}
    </article>
  );
}

/* -------------------------------- Bar tab -------------------------------- */
function BarTab({ recipes, pantry, set, addToBar, removeFromBar }) {
  const [q, setQ] = useState("");
  const [custom, setCustom] = useState("");

  const vocab = useMemo(() => {
    const m = new Map();
    recipes.forEach((r) => r.ingredients.forEach((i) => {
      if (i.garnish) return;
      const k = ckey(i);
      if (!m.has(k)) m.set(k, i.canonical || i.name);
    }));
    return [...m.values()].sort((a, b) => a.localeCompare(b));
  }, [recipes]);

  const filtered = vocab.filter((v) => v.toLowerCase().includes(q.toLowerCase()));

  return (
    <div className="cl-col">
      <SectionTitle>On the shelf <em>{pantry.length}</em></SectionTitle>
      {pantry.length === 0 ? (
        <p className="cl-note">Tap ingredients below to mark what you own.</p>
      ) : (
        <div className="cl-chips">
          {pantry.map((p) => (
            <button key={p} className="cl-chip on" onClick={() => removeFromBar(p)}>
              <Check size={12} /> {p} <X size={12} className="rm" />
            </button>
          ))}
        </div>
      )}

      <div className="cl-addrow">
        <input className="cl-input" placeholder="Add something not listed (e.g. mezcal)"
          value={custom} onChange={(e) => setCustom(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && custom.trim()) { addToBar(custom.trim()); setCustom(""); } }} />
        <button className="cl-btn" disabled={!custom.trim()} onClick={() => { addToBar(custom.trim()); setCustom(""); }}>
          <Plus size={14} /> Add
        </button>
      </div>

      <SectionTitle>Ingredients in your recipes</SectionTitle>
      <p className="cl-note">These come straight from your recipe book, so spellings always match.</p>
      <div className="cl-search">
        <Search size={14} />
        <input placeholder="Filter ingredients…" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      <div className="cl-chips">
        {filtered.map((v) => {
          const have = set.has(normalize(v));
          return (
            <button key={v} className={"cl-chip" + (have ? " on" : "")}
              onClick={() => (have ? removeFromBar(pantry.find((p) => normalize(p) === normalize(v)) || v) : addToBar(v))}>
              {have ? <Check size={12} /> : <Plus size={12} />} {v}
            </button>
          );
        })}
        {filtered.length === 0 && <span className="cl-note">No matches.</span>}
      </div>
    </div>
  );
}

/* ------------------------------ Recipes tab ------------------------------ */
function RecipesTab({ recipes, setRecipes }) {
  const [editing, setEditing] = useState(null); // recipe object or "new"
  const [q, setQ] = useState("");

  const list = recipes
    .filter((r) => r.name.toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => a.name.localeCompare(b.name));

  const save = (r) => {
    setRecipes((rs) => {
      const i = rs.findIndex((x) => x.id === r.id);
      if (i === -1) return [...rs, r];
      const cp = [...rs]; cp[i] = r; return cp;
    });
    setEditing(null);
  };
  const saveMany = (arr) => { setRecipes((rs) => [...rs, ...arr]); setEditing(null); };
  const del = (id) => setRecipes((rs) => rs.filter((r) => r.id !== id));

  if (editing) return <RecipeEditor initial={editing === "new" ? null : editing} onSave={save} onSaveMany={saveMany} onCancel={() => setEditing(null)} />;

  return (
    <div className="cl-col">
      <div className="cl-rowbtns">
        <SectionTitle>Recipe book <em>{recipes.length}</em></SectionTitle>
        <button className="cl-btn gold" onClick={() => setEditing("new")}><Plus size={14} /> Add recipe</button>
      </div>
      <div className="cl-search">
        <Search size={14} />
        <input placeholder="Search recipes…" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      <div className="cl-list">
        {list.map((r) => (
          <div key={r.id} className="cl-listitem">
            <div>
              <div className="cl-listname"><h4>{r.name}</h4>{r.type && <span className="cl-typebadge">{r.type}</span>}</div>
              <p>{r.ingredients.filter((i) => !i.garnish).map((i) => i.canonical || i.name).join(" · ")}</p>
            </div>
            <div className="cl-listactions">
              <button onClick={() => setEditing(r)} title="Edit"><Pencil size={15} /></button>
              <button onClick={() => del(r.id)} title="Delete"><Trash2 size={15} /></button>
            </div>
          </div>
        ))}
        {list.length === 0 && <p className="cl-note">No recipes yet.</p>}
      </div>
    </div>
  );
}

function RecipeEditor({ initial, onSave, onSaveMany, onCancel }) {
  const [mode, setMode] = useState(initial ? "manual" : "text");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [textIn, setTextIn] = useState("");
  const [linkIn, setLinkIn] = useState("");
  const [img, setImg] = useState(null);
  const [draft, setDraft] = useState(
    initial || { id: uid(), name: "", type: "", instructions: "", notes: "", source: "", ingredients: [{ name: "", canonical: "", amount: "", optional: false, garnish: false }] }
  );
  const [extra, setExtra] = useState([]); // additional parsed cocktails beyond the first
  const [dragIdx, setDragIdx] = useState(null);
  const [overIdx, setOverIdx] = useState(null);
  const moveIng = (from, to) => {
    if (from == null || to == null || from === to) return;
    setDraft((d) => {
      const ings = [...d.ingredients];
      const [moved] = ings.splice(from, 1);
      ings.splice(to, 0, moved);
      return { ...d, ingredients: ings };
    });
  };

  const run = async (m, payload) => {
    setBusy(true); setErr("");
    try {
      const parsed = await parseRecipe(m, payload);
      if (!parsed.length) throw new Error("No recipe found.");
      setDraft(parsed[0]);
      setExtra(parsed.slice(1));
      setMode("manual");
    } catch (e) { setErr(e.message || "Something went wrong."); }
    finally { setBusy(false); }
  };

  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => setImg({ media_type: f.type, data: String(reader.result).split(",")[1], preview: reader.result });
    reader.readAsDataURL(f);
  };

  const setIng = (i, key, val) => setDraft((d) => {
    const ings = d.ingredients.map((x, idx) => idx === i ? { ...x, [key]: val } : x);
    return { ...d, ingredients: ings };
  });
  const addIng = () => setDraft((d) => ({ ...d, ingredients: [...d.ingredients, { name: "", canonical: "", amount: "", optional: false, garnish: false }] }));
  const rmIng = (i) => setDraft((d) => ({ ...d, ingredients: d.ingredients.filter((_, idx) => idx !== i) }));

  const commit = () => {
    const clean = { ...draft, name: draft.name.trim(), ingredients: draft.ingredients.filter((i) => (i.name || "").trim()).map((i) => ({ ...i, canonical: (i.canonical || normalize(i.name)).trim() })) };
    if (extra.length) onSaveMany([clean, ...extra]);
    else onSave(clean);
  };

  return (
    <div className="cl-col">
      <div className="cl-rowbtns">
        <SectionTitle>{initial ? "Edit recipe" : "Add a recipe"}</SectionTitle>
        <button className="cl-btn ghost" onClick={onCancel}><X size={14} /> Cancel</button>
      </div>

      {!initial && (
        <div className="cl-modeswitch">
          {[["text", FileText, "Paste recipe"], ["link", Link2, "From a link"], ["image", ImageIcon, "From a photo"]].map(([m, I, lab]) => (
            <button key={m} className={"cl-modebtn" + (mode === m ? " on" : "")} onClick={() => setMode(m)}><I size={14} /> {lab}</button>
          ))}
        </div>
      )}

      {!initial && mode === "text" && (
        <div className="cl-col">
          <textarea className="cl-area" rows={6} placeholder={"Paste a recipe, e.g.\nNegroni\n1 oz gin, 1 oz Campari, 1 oz sweet vermouth\nStir, orange peel."} value={textIn} onChange={(e) => setTextIn(e.target.value)} />
          <button className="cl-btn gold" disabled={busy || !textIn.trim()} onClick={() => run("text", textIn)}>
            {busy ? <Loader2 size={14} className="spin" /> : <Sparkles size={14} />} Read with Claude
          </button>
        </div>
      )}
      {!initial && mode === "link" && (
        <div className="cl-col">
          <input className="cl-input" placeholder="https://… a cocktail recipe page" value={linkIn} onChange={(e) => setLinkIn(e.target.value)} />
          <button className="cl-btn gold" disabled={busy || !linkIn.trim()} onClick={() => run("link", linkIn.trim())}>
            {busy ? <Loader2 size={14} className="spin" /> : <Sparkles size={14} />} Fetch & read
          </button>
          <p className="cl-note">Claude will search the web to retrieve the page. Some sites block this — if it stalls, paste the text instead.</p>
        </div>
      )}
      {!initial && mode === "image" && (
        <div className="cl-col">
          <label className="cl-file">
            <input type="file" accept="image/*" onChange={onFile} />
            <ImageIcon size={16} /> {img ? "Choose a different photo" : "Choose a photo of a recipe"}
          </label>
          {img && <img src={img.preview} alt="recipe" className="cl-preview" />}
          <button className="cl-btn gold" disabled={busy || !img} onClick={() => run("image", img)}>
            {busy ? <Loader2 size={14} className="spin" /> : <Sparkles size={14} />} Read photo
          </button>
        </div>
      )}

      {err && <div className="cl-err"><X size={14} /> {err}</div>}

      {(initial || mode === "manual") && (
        <div className="cl-editor">
          {extra.length > 0 && <div className="cl-multi"><CircleCheck size={14} /> Found {extra.length + 1} cocktails. Review the first below; the rest save automatically.</div>}
          <div className="cl-frow">
            <Field label="Name"><input className="cl-input" value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} /></Field>
            <Field label="Type"><select className="cl-select" value={draft.type} onChange={(e) => setDraft({ ...draft, type: e.target.value })}><option value="">—</option>{["Sour","Old Fashioned","Manhattan","Martini","Negroni","Tiki","Long"].map(t=><option key={t} value={t}>{t}</option>)}</select></Field>
          </div>

          <label className="cl-flabel">Ingredients</label>
          <div className="cl-edings">
            <div className="cl-edhead"><span /><span>Amount</span><span>Ingredient</span><span>Match name</span><span /></div>
            {draft.ingredients.map((i, idx) => (
              <div key={idx}
                className={"cl-edrow" + (dragIdx === idx ? " dragging" : "") + (overIdx === idx ? " over" : "")}
                onDragOver={(e) => { e.preventDefault(); if (overIdx !== idx) setOverIdx(idx); }}
                onDrop={() => { moveIng(dragIdx, idx); setDragIdx(null); setOverIdx(null); }}>
                <span className="cl-grip" draggable
                  onDragStart={(e) => { setDragIdx(idx); e.dataTransfer.effectAllowed = "move"; }}
                  onDragEnd={() => { setDragIdx(null); setOverIdx(null); }}
                  title="Drag to reorder"><GripVertical size={14} /></span>
                <input className="cl-input sm" value={i.amount} placeholder="2 oz" onChange={(e) => setIng(idx, "amount", e.target.value)} />
                <input className="cl-input" value={i.name} placeholder="Gin" onChange={(e) => setIng(idx, "name", e.target.value)} />
                <input className="cl-input" value={i.canonical} placeholder="gin" onChange={(e) => setIng(idx, "canonical", e.target.value)} />
                <button className="cl-iconbtn" onClick={() => rmIng(idx)} title="Delete ingredient"><Minus size={14} /></button>
              </div>
            ))}
            <button className="cl-mini" onClick={addIng}><Plus size={12} /> Add ingredient</button>
          </div>

          <Field label="Method"><textarea className="cl-area" rows={3} value={draft.instructions} onChange={(e) => setDraft({ ...draft, instructions: e.target.value })} /></Field>
          <Field label="Notes (optional)"><textarea className="cl-area" rows={2} placeholder="Tasting notes, attribution, riffs to try…" value={draft.notes} onChange={(e) => setDraft({ ...draft, notes: e.target.value })} /></Field>
          <Field label="Source (optional)"><input className="cl-input" value={draft.source} onChange={(e) => setDraft({ ...draft, source: e.target.value })} /></Field>

          <div className="cl-rowbtns end">
            <button className="cl-btn ghost" onClick={onCancel}>Cancel</button>
            <button className="cl-btn gold" disabled={!draft.name.trim()} onClick={commit}><Check size={14} /> Save{extra.length ? ` all ${extra.length + 1}` : ""}</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ------------------------------ Shopping tab ----------------------------- */
function ShopTab({ recipes, set, addToBar }) {
  const [n, setN] = useState(3);
  const ranked = useMemo(() => rankAdditions(recipes, set), [recipes, set]);
  const topUnlocks = ranked.filter((r) => r.unlocks.length > 0);
  const helpers = ranked.filter((r) => r.unlocks.length === 0 && r.helps.length > 0).slice(0, 8);
  const baseCount = recipes.filter((r) => isMakeable(r, set)).length;
  const plan = useMemo(() => greedyList(recipes, set, n), [recipes, set, n]);
  const [open, setOpen] = useState(null);

  return (
    <div className="cl-col">
      <SectionTitle>Smartest single additions</SectionTitle>
      <p className="cl-note">Ranked by how many cocktails each bottle would <em>immediately</em> unlock — i.e. recipes where it’s the only thing you’re missing.</p>
      {topUnlocks.length === 0 ? (
        <p className="cl-note">No single ingredient finishes a recipe right now. Try the shopping list below, which plans several buys together.</p>
      ) : (
        <div className="cl-list">
          {topUnlocks.map((r) => (
            <div key={r.key} className="cl-listitem col">
              <div className="cl-shoprow">
                <button className="cl-disc" onClick={() => setOpen(open === r.key ? null : r.key)}>
                  {open === r.key ? <ChevronDown size={14} /> : <ChevronRight size={14} />}
                  <span className="cl-shopname">{r.label}</span>
                </button>
                <span className="cl-badge">+{r.unlocks.length} cocktail{r.unlocks.length > 1 ? "s" : ""}</span>
                <button className="cl-btn gold sm" onClick={() => addToBar(r.label)}><Plus size={13} /> Add</button>
              </div>
              {open === r.key && (
                <p className="cl-instr">Unlocks: {r.unlocks.map((c) => c.name).join(", ")}
                  {r.helps.length > r.unlocks.length ? ` · also moves ${r.helps.length - r.unlocks.length} more closer` : ""}</p>
              )}
            </div>
          ))}
        </div>
      )}

      <SectionTitle>Build a shopping list</SectionTitle>
      <p className="cl-note">Greedy plan: each pick is chosen <em>after</em> assuming you bought the ones before it, so the bottles work together.</p>
      <div className="cl-stepper">
        <span>Buy</span>
        <button onClick={() => setN(Math.max(1, n - 1))}><Minus size={14} /></button>
        <strong>{n}</strong>
        <button onClick={() => setN(Math.min(10, n + 1))}><Plus size={14} /></button>
        <span>ingredient{n > 1 ? "s" : ""}</span>
      </div>
      {plan.picks.length === 0 ? (
        <p className="cl-note">No additional unlocks available with your current recipes.</p>
      ) : (
        <div className="cl-plan">
          <ol>
            {plan.picks.map((p, idx) => (
              <li key={p.key}>
                <div className="cl-planhead">
                  <span><b>{idx + 1}.</b> {p.label}</span>
                  <button className="cl-btn gold sm" onClick={() => addToBar(p.label)}><Plus size={13} /> Add</button>
                </div>
                <span className="cl-planmeta">unlocks {p.newCocktails.join(", ")}</span>
              </li>
            ))}
          </ol>
          <div className="cl-plantotal">
            <Martini size={16} /> These {plan.picks.length} would take you from <b>{baseCount}</b> to <b>{plan.totalAfter}</b> makeable cocktails.
          </div>
        </div>
      )}

      {helpers.length > 0 && (
        <>
          <SectionTitle>Also worth keeping an eye on</SectionTitle>
          <div className="cl-chips">
            {helpers.map((h) => (
              <span key={h.key} className="cl-chip ghost">{h.label} · in {h.helps.length} recipes</span>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

.cl-frow{display:flex;gap:12px;flex-wrap:wrap}
.cl-frow .cl-field{flex:1;min-width:140px}
.cl-flabel{font-family:'Fraunces';font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.cl-edings{display:flex;flex-direction:column;gap:6px}
.cl-edhead{display:grid;grid-template-columns:22px 78px 1fr 1fr 30px;gap:8px;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut2);font-family:'Fraunces';padding:0 2px}
.cl-edrow{display:grid;grid-template-columns:22px 78px 1fr 1fr 30px;gap:8px;align-items:center;border-radius:3px}
.cl-edrow.dragging{opacity:.4}
.cl-edrow.over{box-shadow:inset 0 2px 0 var(--gold)}
.cl-grip{display:flex;align-items:center;justify-content:center;color:var(--mut2);cursor:grab;touch-action:none}
.cl-grip:hover{color:var(--gold)}
.cl-grip:active{cursor:grabbing}
.cl-iconbtn{background:none;border:1px solid var(--line);color:var(--mut);border-radius:3px;padding:7px;cursor:pointer}
.cl-iconbtn:hover{color:var(--ox);border-color:var(--ox)}

.cl-shoprow{display:flex;align-items:center;gap:10px}
.cl-disc{flex:1;display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--ink);cursor:pointer;text-align:left;padding:0}
.cl-shopname{font-family:'Fraunces',serif;font-weight:600;font-size:17px}
.cl-badge{font-family:'Fraunces';font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:2px 10px;white-space:nowrap}
.cl-stepper{display:flex;align-items:center;gap:10px;color:var(--mut);font-style:italic;font-size:14px}
.cl-stepper button{background:var(--panel);border:1px solid var(--line);color:var(--ink);width:30px;height:30px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cl-stepper button:hover{border-color:var(--gold)}
.cl-stepper strong{font-family:'Fraunces';font-size:18px;color:var(--gold);min-width:18px;text-align:center}
.cl-plan{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 18px 16px}
.cl-plan ol{list-style:none;margin:0;padding:0}
.cl-plan li{padding:11px 0;border-bottom:1px dashed var(--line)}
.cl-plan li:last-child{border-bottom:none}
.cl-planhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:'Fraunces';font-size:16px}
.cl-planmeta{display:block;margin-top:3px;font-size:12.5px;color:var(--mut2);font-style:italic}
.cl-plantotal{display:flex;align-items:center;gap:9px;margin-top:12px;color:var(--gold);font-style:italic;font-size:14px}
.cl-plantotal b{color:var(--ink);font-style:normal}
.cl-settings-btn{position:fixed;top:14px;right:14px;background:transparent;border:1px solid var(--line);color:var(--mut);padding:7px;border-radius:3px;cursor:pointer;z-index:10;transition:.15s;display:flex}
.cl-settings-btn:hover{color:var(--gold);border-color:var(--gold)}
.cl-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.cl-modal{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:24px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px}
@media(max-width:520px){.cl-edhead,.cl-edrow{grid-template-columns:18px 54px 1fr 24px}.cl-edhead span:nth-child(4){display:none}.cl-edrow .cl-input:nth-child(4){display:none}}
`;

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
